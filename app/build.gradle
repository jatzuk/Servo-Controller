apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'

android {
    namespace "dev.jatzuk.servocontroller"
    compileSdkVersion 36

    defaultConfig {
        applicationId "dev.jatzuk.servocontroller"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 5
        versionName "1.0.2"

        testInstrumentationRunner "dev.jatzuk.servocontroller.HiltTestRunner"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "store"

    productFlavors {

        google {
            dimension "store"
        }

        huawei {
            dimension "store"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.9.0'
    // Activity 1.10.1 supports predictive back while retaining minSdk 21.
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'

    def coroutines_version = '1.6.4'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    def nav_version = "2.5.3"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    def material_design_version = "1.5.0"
    implementation "com.google.android.material:material:$material_design_version"

    def preferences_version = "1.1.1"
    implementation "androidx.preference:preference:$preferences_version"

    // hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"

    def room_version = "2.4.0"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    def lottie_version = "3.4.2"
    implementation "com.airbnb.android:lottie:$lottie_version"

    def view_pager2_version = "1.0.0"
    implementation "androidx.viewpager2:viewpager2:$view_pager2_version"

    def timber_version = "4.7.1"
    implementation "com.jakewharton.timber:timber:$timber_version"

    // unit testing section
    def junit_version = "4.12"
    testImplementation "junit:junit:$junit_version"

    def truth_version = "1.0.1"
    testImplementation "com.google.truth:truth:$truth_version"

    // instrumented testing section
//    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.2.1'
    androidTestImplementation "com.google.truth:truth:$truth_version"

    def junit_ext_version = "1.1.2"
    androidTestImplementation "androidx.test.ext:junit:$junit_ext_version"

    def espresso_version = "3.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_version"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:$espresso_version"

    def mockk_version = "1.14.5"
    testImplementation "io.mockk:mockk:$mockk_version"
    androidTestImplementation "io.mockk:mockk-android:$mockk_version"

    def androidx_test_version = "1.5.0"
    androidTestImplementation "androidx.test:runner:$androidx_test_version"
    androidTestImplementation "androidx.test:core:$androidx_test_version"

    // androidx.fragment
    def fragment_testing_version = "1.6.0-alpha04"
    debugImplementation "androidx.fragment:fragment-testing:$fragment_testing_version"
    implementation "androidx.fragment:fragment-ktx:$fragment_testing_version"

    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    // hilt
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kaptAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"

//    def leak_canary_version = "2.4"
//    debugImplementation "com.squareup.leakcanary:leakcanary-android:$leak_canary_version"

    // 23.6.0 is the newest line that still supports minSdk 21.
    def google_ads_version = "23.6.0"
    googleImplementation "com.google.android.gms:play-services-ads:$google_ads_version"

    def huawei_ads_version = "13.4.86.300"
    huaweiImplementation "com.huawei.hms:ads-lite:$huawei_ads_version"
}
